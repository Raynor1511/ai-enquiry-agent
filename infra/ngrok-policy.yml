# ngrok traffic policy: only n8n's webhook and form endpoints are reachable from the internet.
# The n8n editor, its REST API and login page stay private (open them at http://localhost:5678).
on_http_request:
  - expressions:
      - >-
        !(req.url.path.startsWith('/webhook/') ||
          req.url.path.startsWith('/webhook-test/') ||
          req.url.path.startsWith('/webhook-waiting/') ||
          req.url.path.startsWith('/form/') ||
          req.url.path.startsWith('/form-test/') ||
          req.url.path.startsWith('/form-waiting/'))
    actions:
      - type: deny
        config:
          status_code: 404
