# The gate in front of n8n on the server (compose.server.yml). The shared Caddy edge terminates HTTPS
# for enquiries.raynors.dev and forwards everything here; this decides what reaches n8n. It replaces
# the ngrok traffic policy used when running on a PC (infra/ngrok-policy.yml), with the same rules:
#  1. Only n8n's webhook and form paths, and the demo page (/demo, its own service), are public. The
#     editor, its REST API and login stay private (reached through an SSH tunnel), and so do the
#     evaluation webhook and the demo page's webhooks (the demo service calls those directly).
#  2. Every client IP gets at most 120 requests a minute.
#  3. Form submissions, and the demo page's submit and confirm calls (each enquiry costs Claude calls),
#     are capped at 5 per 10 minutes per client IP and 20 an hour in total. Over a limit: 429 Too Many Requests with Retry-After, and n8n never sees it.
# The windows are sliding (HAProxy stick tables). Check the file with:
#   docker run --rm -v "$PWD/infra/gate:/usr/local/etc/haproxy:ro" haproxy:3.2.25-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

global
	log stdout format raw local0 info
	maxconn 2000

defaults
	mode http
	log global
	option httplog
	timeout connect 5s
	timeout client 60s
	timeout server 120s
	timeout http-request 10s

# Docker's internal DNS, so a restarted n8n container (new IP) is found again.
resolvers docker
	nameserver dns 127.0.0.11:53
	hold valid 10s

frontend public
	bind :8080
	# The real client IP: Caddy, the only thing in front of this port, replaces X-Forwarded-For with it.
	http-request set-src hdr_ip(X-Forwarded-For,-1) if { req.hdr(X-Forwarded-For) -m found }

	# No public path needs //, /./, /../ or %-encoding, so such paths are refused before any rule below:
	# a disguised spelling of a private path can't slip past them.
	acl odd_path path -m sub // /./ /../ %
	http-request deny deny_status 404 if odd_path

	# 1. Only webhooks, forms and the demo page are public; the evaluation and demo webhooks are not.
	acl public_path path_beg /webhook/ /webhook-test/ /webhook-waiting/ /form/ /form-test/ /form-waiting/
	acl demo_path path /demo
	acl demo_path path_beg /demo/
	acl private_hook path_beg /webhook/harbourline-test-intake /webhook-test/harbourline-test-intake
	acl private_hook path_beg -i /webhook/harbourline-demo- /webhook-test/harbourline-demo- /webhook-waiting/harbourline-demo-
	http-request deny deny_status 404 if !public_path !demo_path || private_hook

	# 2. Requests per client IP, on every public path.
	http-request track-sc0 src table st_per_ip
	http-request deny deny_status 429 hdr Retry-After 60 if { sc_http_req_rate(0,st_per_ip) gt 120 }

	# 3. Form submissions: per client IP, then in total.
	acl form_submit method POST
	acl form_path path_beg /form/ /form-test/
	acl form_path path /demo/api/start /demo/api/confirm
	http-request track-sc1 src table st_form_ip if form_submit form_path
	http-request deny deny_status 429 hdr Retry-After 600 if form_submit form_path { sc_http_req_rate(1,st_form_ip) gt 5 }
	http-request track-sc2 str(all) table st_form_total if form_submit form_path
	http-request deny deny_status 429 hdr Retry-After 3600 if form_submit form_path { sc_http_req_rate(2,st_form_total) gt 20 }

	use_backend demo if demo_path
	default_backend n8n

backend demo
	# Approving on the demo page waits for the email and calendar steps.
	timeout server 150s
	server demo demo:8080 resolvers docker init-addr libc,none

backend n8n
	server n8n n8n:5678 resolvers docker init-addr libc,none

# Counters only (no servers).
backend st_per_ip
	stick-table type ip size 100k expire 2m store http_req_rate(1m)

backend st_form_ip
	stick-table type ip size 100k expire 20m store http_req_rate(10m)

backend st_form_total
	stick-table type string len 8 size 10 expire 2h store http_req_rate(1h)
