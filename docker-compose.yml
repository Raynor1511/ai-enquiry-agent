# Local stack: n8n + the MCP server + an ngrok tunnel for Slack and webhooks.
#   docker compose up -d --build     then open http://localhost:5678
# Values come from .env (see .env.example). Only the variables each service needs are passed to it.
name: harbourline

services:
  n8n:
    image: n8nio/n8n:2.46.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # editor: this PC only
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # The editor (and Google's OAuth redirect) use localhost; public webhooks use the ngrok address.
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: https://${NGROK_DOMAIN:?Set NGROK_DOMAIN in .env}/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run node scripts/init-env.mjs to generate N8N_ENCRYPTION_KEY}
      # Plain-http cookie is fine: the editor is bound to 127.0.0.1 and blocked at the tunnel.
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/London
      TZ: Europe/London
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Execution history includes enquiry text and Claude's replies, so it is deleted after 14 days
      # (n8n's defaults, stated here on purpose; see docs/data-protection.md).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      mcp-server:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    image: harbourline-mcp:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3333:3333" # for local testing; n8n uses http://mcp-server:3333/mcp
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-require}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Run node scripts/init-env.mjs to generate MCP_AUTH_TOKEN}
      CALENDAR_SOURCE: ${CALENDAR_SOURCE:-seed}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/google_calendar_sa
      FIXED_NOW: ${FIXED_NOW:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - google_calendar_sa

  ngrok:
    image: ngrok/ngrok:3.39.13-alpine
    restart: unless-stopped
    command:
      - http
      - n8n:5678
      - --url
      - https://${NGROK_DOMAIN:?Set NGROK_DOMAIN in .env}
      - --traffic-policy-file
      - /etc/ngrok/policy.yml
      - --log
      - stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    volumes:
      - ./infra/ngrok-policy.yml:/etc/ngrok/policy.yml:ro
    depends_on:
      - n8n

volumes:
  n8n_data:

secrets:
  # The Google service account key stays outside the repo and the image; it's mounted read-only.
  # Without Google (CALENDAR_SOURCE=seed) a placeholder is mounted and never read.
  google_calendar_sa:
    file: ${GOOGLE_SERVICE_ACCOUNT_KEY_FILE:-./infra/google-key.placeholder.json}
