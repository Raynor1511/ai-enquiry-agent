<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Start your demo · Harbourline</title>
  <link rel="icon" href="/demo/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/demo/assets/style.css">
  <script src="/demo/assets/confirm.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <p class="brand"><img src="/demo/assets/icon.svg" alt="" width="28" height="28"> Harbourline <span>live demo</span></p>
      <p class="tag">Fictional company · real AI pipeline</p>
    </div>
  </header>
  <main class="wrap narrow">
    <section class="card center">
      <h1>Ready when you are</h1>
      <p id="intro">Press the button to send your enquiry through the agent. You'll watch each step on the next page.</p>
      <button type="button" class="primary big" id="go" disabled>Start my demo</button>
      <p class="error" id="problem" role="alert" hidden></p>
      <p class="small"><a href="/demo">Back to the demo page</a></p>
    </section>
  </main>
</body>
</html>
